<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #fafafa;
            height: 100vh;
            overflow: hidden;
        }
        .page {
            display: none;
            height: 100vh;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        
        /* Top controls */
        .top-controls {
            display: flex;
            background: white;
            border-bottom: 1px solid #e1e5e9;
            padding: 12px;
            gap: 12px;
        }
        .control-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #e1e5e9;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            background: white;
            color: #374151;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .control-btn:hover {
            background: #f8f9fa;
        }
        .control-btn.active {
            background: #f0f9ff;
            border-color: #0ea5e9;
            color: #0ea5e9;
        }
        .control-btn.stop {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #dc2626;
        }
        .control-btn.stop:hover {
            background: #fee2e2;
        }
        
        /* Text view - Simple transcription */
        .text-view {
            flex: 1;
            background: white;
            padding: 20px;
            overflow-y: auto;
        }
        .text-entry {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f1f5f9;
        }
        .text-entry:last-child {
            border-bottom: none;
        }
        .text-meta {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
        }
        .text-content {
            font-size: 15px;
            line-height: 1.5;
            color: #1e293b;
        }
        
        /* Logs view - Clean terminal */
        .logs-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
        }
        .logs-tabs {
            display: flex;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logs-tab {
            padding: 10px 16px;
            cursor: pointer;
            border: none;
            background: none;
            color: #94a3b8;
            font-size: 13px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }
        .logs-tab.active {
            color: #e2e8f0;
            background: #0f172a;
        }
        .logs-content {
            flex: 1;
            background: #0f172a;
            overflow-y: auto;
            padding: 16px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.4;
            color: #e2e8f0;
        }
        .log-line {
            margin-bottom: 2px;
        }
        .log-line.translate {
            color: #10b981;
        }
        .log-line.error {
            color: #ef4444;
        }
        .log-line.info {
            color: #3b82f6;
        }
        .log-line.debug {
            color: #94a3b8;
        }
        
        .status-bar {
            background: #1e293b;
            padding: 8px 16px;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            gap: 24px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .status-dot.green { background: #10b981; }
        .status-dot.red { background: #ef4444; }
        
        .hidden { display: none; }
        
        /* Config page */
        .config-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #e1e5e9;
        }
        .form-section h3 {
            margin-bottom: 16px;
            font-size: 16px;
            color: #1e293b;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
        }
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }
        .start-button {
            text-align: center;
            margin-top: 24px;
        }
        .start-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .start-btn:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>
    <!-- Config Page -->
    <div id="configPage" class="page active">
        <div class="config-form">
            <div class="form-section">
                <h3>Audio Devices</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="agentDevice">Agent</label>
                        <select id="agentDevice">
                            <option value="KT USB Audio">KT USB Audio</option>
                            <option value="CM477">CM477</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phoneDevice">Phone</label>
                        <select id="phoneDevice">
                            <option value="CM477">CM477</option>
                            <option value="KT USB Audio">KT USB Audio</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Languages</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="agentLanguage">Agent</label>
                        <select id="agentLanguage">
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="it">Italiano</option>
                            <option value="pt">Português</option>
                            <option value="nl">Nederlands</option>
                            <option value="pl">Polski</option>
                            <option value="ru">Русский</option>
                            <option value="ja">日本語</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phoneLanguage">Phone</label>
                        <select id="phoneLanguage">
                            <option value="auto">Auto</option>
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="it">Italiano</option>
                            <option value="pt">Português</option>
                            <option value="nl">Nederlands</option>
                            <option value="pl">Polski</option>
                            <option value="ru">Русский</option>
                            <option value="ja">日本語</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="start-button">
                <button class="start-btn" onclick="startAndSwitchToMonitor()">
                    Start Translation
                </button>
            </div>
        </div>
    </div>

    <!-- Monitor Page -->
    <div id="monitorPage" class="page">
        <div class="top-controls">
            <button class="control-btn stop" onclick="stopAndGoToConfig()">
                Stop
            </button>
            <button class="control-btn active" onclick="switchMode('text')">
                Text
            </button>
            <button class="control-btn" onclick="switchMode('logs')">
                Logs
            </button>
        </div>

        <!-- Text Mode -->
        <div id="textView" class="text-view">
            <div class="text-entry">
                <div class="text-meta">Waiting for translations...</div>
                <div class="text-content">Ready to receive transcriptions</div>
            </div>
        </div>

        <!-- Logs Mode -->
        <div id="logsView" class="logs-view hidden">
            <div class="logs-tabs">
                <button class="logs-tab active" onclick="switchTab('translate')">
                    Translations (<span id="translateCount">0</span>)
                </button>
                <button class="logs-tab" onclick="switchTab('debug')">
                    Debug (<span id="debugCount">0</span>)
                </button>
            </div>
            
            <div class="logs-content" id="logsContent">
                <div id="translateLogs">
                    Waiting for translation logs...
                </div>
                <div id="debugLogs" class="hidden">
                    Waiting for debug logs...
                </div>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot" id="connectionDot"></span>
                    <span id="connectionText">Connection</span>
                </div>
                <div class="status-item">
                    <span class="status-dot" id="scriptDot"></span>
                    <span id="scriptText">Script</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let isConnected = false;
        let activeTab = 'translate';
        let activeMode = 'text';
        let translateLogs = [];
        let debugLogs = [];
        let currentConfig = {};

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            socket = new WebSocket(wsUrl);
            
            socket.onopen = function(event) {
                isConnected = true;
                updateConnectionStatus(true);
            };
            
            socket.onmessage = function(event) {
                const message = JSON.parse(event.data);
                
                switch(message.type) {
                    case 'status_update':
                        updateScriptStatus(message.data);
                        break;
                    case 'logs_update':
                        updateLogs(message.data);
                        break;
                    case 'config_update':
                        updateConfigForm(message.data);
                        break;
                }
            };
            
            socket.onclose = function(event) {
                isConnected = false;
                updateConnectionStatus(false);
                setTimeout(() => initWebSocket(), 3000);
            };
        }

        function switchMode(mode) {
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if (mode !== 'stop') {
                document.querySelector(`.control-btn:nth-child(${mode === 'text' ? '2' : '3'})`).classList.add('active');
                
                if (mode === 'text') {
                    document.getElementById('textView').classList.remove('hidden');
                    document.getElementById('logsView').classList.add('hidden');
                } else {
                    document.getElementById('textView').classList.add('hidden');
                    document.getElementById('logsView').classList.remove('hidden');
                }
                
                activeMode = mode;
            }
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');
            
            if (dot && text) {
                dot.className = `status-dot ${connected ? 'green' : 'red'}`;
                text.textContent = connected ? 'Connected' : 'Disconnected';
            }
        }

        function updateScriptStatus(status) {
            const dot = document.getElementById('scriptDot');
            const text = document.getElementById('scriptText');
            
            if (dot && text) {
                dot.className = `status-dot ${status.running ? 'green' : 'red'}`;
                text.textContent = status.running ? `Running (${status.log_count})` : 'Stopped';
            }
        }

        function parseLogLine(rawLog) {
            const match = rawLog.match(/\[.*?\]\s+([A-Z]+):\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+-\s+(.+)/);
            if (match) {
                const [, level, message] = match;
                return {
                    level: level,
                    message: message,
                    isTranslate: level === 'TRANSLATE',
                    timestamp: new Date().toLocaleTimeString()
                };
            }
            return null;
        }

        function updateLogs(logs) {
            if (!logs || logs.length === 0) return;

            const parsedLogs = logs.map(parseLogLine).filter(Boolean);
            const newTranslateLogs = parsedLogs.filter(log => log.isTranslate);
            const newDebugLogs = parsedLogs.filter(log => !log.isTranslate);

            // Update text view
            updateTextView(newTranslateLogs);

            // Update logs view
            updateLogsView('translateLogs', newTranslateLogs);
            updateLogsView('debugLogs', newDebugLogs);

            // Update counters
            document.getElementById('translateCount').textContent = newTranslateLogs.length;
            document.getElementById('debugCount').textContent = newDebugLogs.length;
        }

        function updateTextView(newLogs) {
            const textView = document.getElementById('textView');
            
            newLogs.forEach(log => {
                if (textView.innerHTML.includes('Waiting for translations')) {
                    textView.innerHTML = '';
                }

                const entry = document.createElement('div');
                entry.className = 'text-entry';
                entry.innerHTML = `
                    <div class="text-meta">${log.timestamp}</div>
                    <div class="text-content">${log.message}</div>
                `;
                
                textView.appendChild(entry);
                
                if (activeMode === 'text') {
                    textView.scrollTop = textView.scrollHeight;
                }
            });

            while (textView.children.length > 50) {
                textView.removeChild(textView.firstChild);
            }
        }

        function updateLogsView(containerId, newLogs) {
            const container = document.getElementById(containerId);
            if (!container) return;

            newLogs.forEach(log => {
                if (container.innerHTML.includes('Waiting for')) {
                    container.innerHTML = '';
                }

                const logElement = document.createElement('div');
                logElement.className = `log-line ${log.level.toLowerCase()}`;
                logElement.textContent = `[${log.timestamp}] ${log.level}: ${log.message}`;
                container.appendChild(logElement);
            });

            while (container.children.length > 100) {
                container.removeChild(container.firstChild);
            }

            if (activeMode === 'logs') {
                container.parentElement.scrollTop = container.parentElement.scrollHeight;
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.logs-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            document.getElementById('translateLogs').classList.add('hidden');
            document.getElementById('debugLogs').classList.add('hidden');
            document.getElementById(tabName + 'Logs').classList.remove('hidden');

            activeTab = tabName;
        }

        function updateConfigForm(config) {
            currentConfig = config;
            if (config.devices) {
                document.getElementById('agentDevice').value = config.devices.agent || 'KT USB Audio';
                document.getElementById('phoneDevice').value = config.devices.phone || 'CM477';
            }
            if (config.languages) {
                document.getElementById('agentLanguage').value = config.languages.agent || 'de';
                document.getElementById('phoneLanguage').value = config.languages.phone || 'fr';
            }
        }

        function saveConfig() {
            const config = {
                ...currentConfig,
                devices: {
                    agent: document.getElementById('agentDevice').value,
                    phone: document.getElementById('phoneDevice').value
                },
                languages: {
                    agent: document.getElementById('agentLanguage').value,
                    phone: document.getElementById('phoneLanguage').value
                }
            };

            if (socket && isConnected) {
                socket.send(JSON.stringify({
                    type: 'update_config',
                    data: config
                }));
            }
        }

        function startAndSwitchToMonitor() {
            saveConfig();
            document.getElementById('configPage').classList.remove('active');
            document.getElementById('monitorPage').classList.add('active');
            setTimeout(() => sendCommand('start'), 500);
        }

        function stopAndGoToConfig() {
            if (socket && isConnected) {
                socket.send(JSON.stringify({ type: 'stop_script' }));
            }
            setTimeout(() => {
                document.getElementById('monitorPage').classList.remove('active');
                document.getElementById('configPage').classList.add('active');
            }, 1000);
        }

        function sendCommand(command) {
            if (socket && isConnected) {
                socket.send(JSON.stringify({ type: command + '_script' }));
            }
        }

        window.addEventListener('load', initWebSocket);
    </script>
</body>
</html>
