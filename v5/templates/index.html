<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        .page {
            display: none;
            height: 100vh;
            padding: 5px;
        }
        .page.active {
            display: flex;
            flex-direction: column;
        }
        button {
            padding: 8px 15px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .play-btn {
            background-color: #28a745;
            color: white;
            font-size: 18px;
            padding: 15px 30px;
        }
        .play-btn:hover:not(:disabled) {
            background-color: #218838;
        }
        .stop-btn {
            background-color: #dc3545;
            color: white;
        }
        .stop-btn:hover:not(:disabled) {
            background-color: #c82333;
        }
        .terminal-tabs {
            display: flex;
            background-color: #e9ecef;
            border-bottom: 1px solid #dee2e6;
        }
        .terminal-tab {
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: bold;
            color: #6c757d;
            border-bottom: 2px solid transparent;
            font-size: 12px;
        }
        .terminal-tab.active {
            color: #007bff;
            border-bottom-color: #007bff;
            background-color: #f8f9fa;
        }
        .logs-container {
            flex: 1;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            overflow-y: auto;
            position: relative;
        }
        .logs {
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            line-height: 1.3;
            height: 100%;
        }
        .log-line {
            margin-bottom: 1px;
        }
        .log-line.new-log {
            background-color: #e8f5e8;
            animation: highlight 1s ease-out;
        }
        .log-line.translate {
            color: #28a745;
            font-weight: bold;
        }
        .log-line.debug {
            color: #6c757d;
        }
        .log-line.error {
            color: #dc3545;
        }
        .log-line.info {
            color: #007bff;
        }
        @keyframes highlight {
            0% { background-color: #e8f5e8; }
            100% { background-color: transparent; }
        }
        .controls {
            padding: 5px;
            background: white;
            border-bottom: 1px solid #dee2e6;
        }
        .status-bar {
            background: white;
            border-top: 1px solid #dee2e6;
            padding: 4px 8px;
        }
        .status-indicator {
            font-size: 11px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .status-dot.connected {
            background-color: #28a745;
        }
        .status-dot.disconnected {
            background-color: #dc3545;
        }
        .status-dot.running {
            background-color: #28a745;
        }
        .status-dot.stopped {
            background-color: #dc3545;
        }
        .hidden {
            display: none;
        }
        
        /* Configuration page styles */
        .config-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
            font-size: 12px;
        }
        .form-group select {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .config-section {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            border-left: 3px solid #007bff;
        }
        .config-section h3 {
            margin-bottom: 8px;
            color: #007bff;
            font-size: 14px;
        }
        .play-button-container {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- Page de Configuration -->
    <div id="configPage" class="page active">
        <div class="config-form">
            <div class="config-section">
                <h3>🎧 Audio Devices</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="agentDevice">Agent:</label>
                        <select id="agentDevice">
                            <option value="KT USB Audio">KT USB Audio</option>
                            <option value="CM477">CM477</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phoneDevice">Phone:</label>
                        <select id="phoneDevice">
                            <option value="CM477">CM477</option>
                            <option value="KT USB Audio">KT USB Audio</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="config-section">
                <h3>🌍 Languages</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="agentLanguage">Agent:</label>
                        <select id="agentLanguage">
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="it">Italiano</option>
                            <option value="pt">Português</option>
                            <option value="nl">Nederlands</option>
                            <option value="pl">Polski</option>
                            <option value="ru">Русский</option>
                            <option value="ja">日本語</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phoneLanguage">Phone:</label>
                        <select id="phoneLanguage">
                            <option value="auto">Auto</option>
                            <option value="en">English</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="it">Italiano</option>
                            <option value="pt">Português</option>
                            <option value="nl">Nederlands</option>
                            <option value="pl">Polski</option>
                            <option value="ru">Русский</option>
                            <option value="ja">日本語</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="play-button-container">
                <button class="play-btn" onclick="startAndSwitchToMonitor()">
                    ▶️ Start & Monitor
                </button>
            </div>
        </div>
    </div>

    <!-- Page de Monitoring -->
    <div id="monitorPage" class="page">
        <div class="controls">
            <button class="stop-btn" onclick="stopAndGoToConfig()">
                Stop & Configure
            </button>
        </div>

        <div class="terminal-tabs">
            <button class="terminal-tab active" onclick="switchTab('translate')">
                🗣️ Translations (<span id="translateCount">0</span>)
            </button>
            <button class="terminal-tab" onclick="switchTab('debug')">
                🔧 Debug (<span id="debugCount">0</span>)
            </button>
        </div>
        
        <div class="logs-container">
            <div id="translateLogs" class="logs">
                Waiting for translation logs...
            </div>
            <div id="debugLogs" class="logs hidden">
                Waiting for debug logs...
            </div>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <span><span class="status-dot" id="connectionDot"></span><span id="connectionText">...</span></span>
                <span><span class="status-dot" id="scriptDot"></span><span id="scriptText">...</span></span>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let isConnected = false;
        let activeTab = 'translate';
        let translateLogs = [];
        let debugLogs = [];
        let currentConfig = {};

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            socket = new WebSocket(wsUrl);
            
            socket.onopen = function(event) {
                console.log('WebSocket connected');
                isConnected = true;
                updateConnectionStatus(true);
            };
            
            socket.onmessage = function(event) {
                const message = JSON.parse(event.data);
                
                switch(message.type) {
                    case 'status_update':
                        updateScriptStatus(message.data);
                        break;
                    case 'logs_update':
                        updateLogs(message.data);
                        break;
                    case 'config_update':
                        updateConfigForm(message.data);
                        break;
                    case 'command_response':
                        console.log('Command response:', message.data);
                        if (message.data.status === 'error') {
                            alert(message.data.message);
                        }
                        break;
                }
            };
            
            socket.onclose = function(event) {
                console.log('WebSocket disconnected');
                isConnected = false;
                updateConnectionStatus(false);
                
                setTimeout(() => {
                    console.log('Attempting to reconnect...');
                    initWebSocket();
                }, 3000);
            };
            
            socket.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus(false);
            };
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');
            
            if (connected) {
                dot.className = 'status-dot connected';
                text.textContent = 'Connected';
            } else {
                dot.className = 'status-dot disconnected';
                text.textContent = 'Disconnected';
            }
        }

        function updateScriptStatus(status) {
            const dot = document.getElementById('scriptDot');
            const text = document.getElementById('scriptText');
            
            if (status.running) {
                dot.className = 'status-dot running';
                text.textContent = `Running (${status.log_count})`;
            } else {
                dot.className = 'status-dot stopped';
                text.textContent = 'Stopped';
            }
        }

        function updateConfigForm(config) {
            currentConfig = config;
            
            if (config.devices) {
                document.getElementById('agentDevice').value = config.devices.agent || 'KT USB Audio';
                document.getElementById('phoneDevice').value = config.devices.phone || 'CM477';
            }
            
            if (config.languages) {
                document.getElementById('agentLanguage').value = config.languages.agent || 'de';
                document.getElementById('phoneLanguage').value = config.languages.phone || 'fr';
            }
        }

        function saveConfig() {
            const config = {
                ...currentConfig,
                devices: {
                    agent: document.getElementById('agentDevice').value,
                    phone: document.getElementById('phoneDevice').value
                },
                languages: {
                    agent: document.getElementById('agentLanguage').value,
                    phone: document.getElementById('phoneLanguage').value
                }
            };

            if (socket && isConnected) {
                socket.send(JSON.stringify({
                    type: 'update_config',
                    data: config
                }));
            }
        }

        function startAndSwitchToMonitor() {
            saveConfig();
            showMonitorPage();
            setTimeout(() => {
                sendCommand('start');
            }, 500);
        }

        function showConfigPage() {
            document.getElementById('configPage').classList.add('active');
            document.getElementById('monitorPage').classList.remove('active');
        }

        function showMonitorPage() {
            document.getElementById('configPage').classList.remove('active');
            document.getElementById('monitorPage').classList.add('active');
        }

        function parseLogLine(rawLog) {
            const match = rawLog.match(/\[.*?\]\s+([A-Z]+):\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s+-\s+(.+)/);
            if (match) {
                const [, level, message] = match;
                return {
                    level: level,
                    message: message,
                    formatted: `${level}: ${message}`,
                    isTranslate: level === 'TRANSLATE'
                };
            }
            
            return {
                level: 'UNKNOWN',
                message: rawLog,
                formatted: rawLog,
                isTranslate: false
            };
        }

        function updateLogs(logs) {
            if (!logs || logs.length === 0) return;

            const parsedLogs = logs.map(parseLogLine);
            const newTranslateLogs = parsedLogs.filter(log => log.isTranslate);
            const newDebugLogs = parsedLogs.filter(log => !log.isTranslate);

            const newTranslateEntries = newTranslateLogs.filter(log => 
                !translateLogs.some(existing => existing.formatted === log.formatted)
            );
            const newDebugEntries = newDebugLogs.filter(log => 
                !debugLogs.some(existing => existing.formatted === log.formatted)
            );

            addNewLogs('translateLogs', newTranslateEntries);
            addNewLogs('debugLogs', newDebugEntries);

            translateLogs = newTranslateLogs.slice(-50);
            debugLogs = newDebugLogs.slice(-50);

            const translateCountEl = document.getElementById('translateCount');
            const debugCountEl = document.getElementById('debugCount');
            if (translateCountEl) translateCountEl.textContent = translateLogs.length;
            if (debugCountEl) debugCountEl.textContent = debugLogs.length;
        }

        function addNewLogs(terminalId, newLogs) {
            const terminal = document.getElementById(terminalId);
            if (!terminal) return;

            newLogs.forEach(log => {
                const logElement = document.createElement('div');
                logElement.className = `log-line ${log.level.toLowerCase()} new-log`;
                logElement.textContent = log.formatted;
                terminal.appendChild(logElement);

                setTimeout(() => {
                    logElement.classList.remove('new-log');
                }, 1000);
            });

            while (terminal.children.length > 50) {
                terminal.removeChild(terminal.firstChild);
            }

            if ((terminalId === 'translateLogs' && activeTab === 'translate') ||
                (terminalId === 'debugLogs' && activeTab === 'debug')) {
                terminal.parentElement.scrollTop = terminal.parentElement.scrollHeight;
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.terminal-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            document.getElementById('translateLogs').classList.add('hidden');
            document.getElementById('debugLogs').classList.add('hidden');

            const activeTerminal = document.getElementById(tabName + 'Logs');
            activeTerminal.classList.remove('hidden');

            activeTab = tabName;
            activeTerminal.parentElement.scrollTop = activeTerminal.parentElement.scrollHeight;
        }

        function stopAndGoToConfig() {
            if (!isConnected || !socket) {
                alert('Not connected to server');
                return;
            }
            
            const message = {
                type: 'stop_script'
            };
            
            socket.send(JSON.stringify(message));
            
            setTimeout(() => {
                showConfigPage();
            }, 1000);
        }

        function sendCommand(command) {
            if (!isConnected || !socket) {
                alert('Not connected to server');
                return;
            }
            
            const message = {
                type: command + '_script'
            };
            
            socket.send(JSON.stringify(message));
        }

        window.addEventListener('load', function() {
            initWebSocket();
        });

        window.addEventListener('beforeunload', function() {
            if (socket) {
                socket.close();
            }
        });
    </script>
</body>
</html>
